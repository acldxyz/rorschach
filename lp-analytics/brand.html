<div class="brand">
      <div class="row"><b class="bm-title">Brand</b><span class="note">Your colours and font, used on screen, in the charts and in the PNG and HTML downloads.</span></div>
      <div class="brand-row">
        <label for="brandColors">Colours <input id="brandColors" spellcheck="false" autocomplete="off" placeholder="#0B3D91, #F2A900, #6C757D"></label>
        <span class="swatches" id="brandSwatches" aria-hidden="true"></span>
        <label for="brandFont">Font <input id="brandFont" spellcheck="false" autocomplete="off" placeholder="e.g. Inter or Calibri"></label>
        <button type="button" id="brandReset">Reset</button>
      </div>
      <p class="note" id="brandNote" role="status"></p>
    </div>
